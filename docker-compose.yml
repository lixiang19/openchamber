services:
  openaurora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openaurora
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/openaurora:/home/openaurora/.config/openaurora
      - ./data/opencode/share:/home/openaurora/.local/share/opencode
      - ./data/opencode/state:/home/openaurora/.local/state/opencode
      - ./data/opencode/config:/home/openaurora/.config/opencode
      - ./data/ssh:/home/openaurora/.ssh
      - ./workspaces:/home/openaurora/workspaces
    #environment:
    # UI_PASSWORD: your_secure_password_here  # Uncomment to set UI password
    # OPENAURORA_TUNNEL_PROVIDER: cloudflare
    # OPENAURORA_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # OPENAURORA_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # OPENAURORA_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # OPENAURORA_TUNNEL_CONFIG: /home/openaurora/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    restart: unless-stopped
