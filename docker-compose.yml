services:
  ridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridge
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/ridge:/home/ridge/.config/ridge
      - ./data/opencode/share:/home/ridge/.local/share/opencode
      - ./data/opencode/state:/home/ridge/.local/state/opencode
      - ./data/opencode/config:/home/ridge/.config/opencode
      - ./data/ssh:/home/ridge/.ssh
      - ./workspaces:/home/ridge/workspaces
    #environment:
    # UI_PASSWORD: your_secure_password_here  # Uncomment to set UI password
    # RIDGE_TUNNEL_PROVIDER: cloudflare
    # RIDGE_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # RIDGE_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # RIDGE_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # RIDGE_TUNNEL_CONFIG: /home/ridge/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    restart: unless-stopped
